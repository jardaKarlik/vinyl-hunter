<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Vinyl Hunter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="logo">
        <div class="vinyl-disc" id="vinylDisc"></div>
        <h1>Vinyl Hunter</h1>
      </div>
      <p class="tagline">YouTube → Tracklist → Discogs</p>
      <div class="chips">
        <span class="chip chip-green" id="userChip">⬤ LeeCZ connected</span>
        <span class="chip chip-muted">EU only · excl. UK</span>
      </div>
      <div class="grade-legend">
        <span class="glabel">grades:</span>
        <span class="gpill ok">M</span>
        <span class="gpill ok">NM</span>
        <span class="gpill ok">VG+</span>
        <span class="gpill ok">VG</span>
        <span class="gpill no">G+</span>
        <span class="gpill no">G</span>
        <span class="gpill no">Poor</span>
      </div>
    </header>

    <!-- URL Input -->
    <section class="card" id="inputCard">
      <label class="field-label">YouTube URL</label>
      <div class="input-row">
        <input
          type="url"
          id="urlInput"
          placeholder="https://youtube.com/watch?v=..."
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        />
        <button class="btn btn-primary" id="searchBtn" onclick="App.start()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Search
        </button>
      </div>
      <p class="field-hint">Paste any YouTube video or mix — works best with videos that have chapter markers</p>
    </section>

    <!-- Dynamic content area -->
    <div id="content"></div>

  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script src="/js/app.js"></script>
</body>
</html>
